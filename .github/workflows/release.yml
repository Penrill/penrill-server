name: Release Packages (APT & Snap)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (defaults to Directory.Build.props)'
        required: false
        type: string

# Jobs get only what they need; the ones that publish say so themselves.
permissions:
  contents: read

jobs:
  prepare:
    name: Test & Resolve Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            ver="$INPUT_VERSION"
          elif [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | tr -d '[:space:]')
          fi
          # The version ends up in file names and shell commands later on: only a plain version number gets through.
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "Not a version number: $ver" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: dotnet test -c Release

  deb:
    name: Build .deb (amd64 & arm64)
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Build Debian packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: sh packaging/build-deb.sh "$VERSION" dist "amd64 arm64"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-packages
          path: dist/penrill-server_*.deb
          if-no-files-found: error

  snap:
    name: Build .snap (${{ matrix.arch }})
    # Snap is switched off for now; delete this line to publish it again (publish must then need it too).
    if: false
    needs: prepare
    runs-on: ${{ matrix.runner }}
    env:
      # At job level, so the upload step's `if` can see it: a step's own `env` is not visible to its `if`.
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build Snap package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          sed -i "s/^version:.*/version: '$VERSION'/" snap/snapcraft.yaml
          mkdir -p dist
          sudo snapcraft pack --destructive-mode --output "dist/penrill-server_${VERSION}_${ARCH}.snap"
          sudo chown "$USER:$USER" "dist/penrill-server_${VERSION}_${ARCH}.snap"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snap-${{ matrix.arch }}
          path: dist/penrill-server_*.snap
          if-no-files-found: error

      - name: Publish to Snap Store
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          snapcraft upload --release=stable "dist/penrill-server_${VERSION}_${ARCH}.snap"

  publish:
    name: Publish GitHub Release & Build APT Repo
    needs: [prepare, deb]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write # configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum penrill-server_* > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.prepare.outputs.tag }}
          ver: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/penrill-server_* dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/penrill-server_* dist/SHA256SUMS \
              --title "Penrill Server $ver" \
              --generate-notes
          fi

      - name: Build APT repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # The script refuses to build an unsigned APT repository. Until the GPG_PRIVATE_KEY secret is
          # added, allow it explicitly (with a warning); once the secret exists the repository is signed.
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::GPG_PRIVATE_KEY is not set: publishing an UNSIGNED APT repository"
            export ALLOW_UNSIGNED=1
          fi
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          sh packaging/build-apt-repo.sh dist dist/apt-repo "https://${owner}.github.io/${repo}"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/apt-repo

  deploy-pages:
    name: Deploy APT Repository to GitHub Pages
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
