name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - run: dotnet restore Penrill.slnx
      - run: dotnet build Penrill.slnx --no-restore -c Release
      - run: dotnet test Penrill.slnx --no-build --configuration Release

      - name: PostgreSQL migrations check or bootstrap
        id: ef
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.15
          if [ -d src/Infrastructure/Data/Migrations ] && ls src/Infrastructure/Data/Migrations/*.cs >/dev/null 2>&1; then
            dotnet ef migrations has-pending-model-changes --project src/Infrastructure --startup-project src/Infrastructure --no-build --configuration Release
          else
            dotnet ef migrations add Initial --project src/Infrastructure --startup-project src/Infrastructure --output-dir Data/Migrations --configuration Release
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated Initial migration
        if: steps.ef.outputs.generated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: initial-migrations
          path: src/Infrastructure/Data/Migrations
