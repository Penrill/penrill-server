# Publishes the shared core that Penrill Cloud builds on to GitHub Packages, on every release tag:
# Penrill.Domain, Penrill.Application, Penrill.Infrastructure, Penrill.Web and Penrill.Contract.Tests.
name: Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Version
        id: version
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)" >> "$GITHUB_OUTPUT"; fi

      - run: dotnet test Penrill.slnx -c Release

      - name: Pack
        run: |
          for project in src/Domain src/Application src/Infrastructure src/Web tests/Contract; do
            dotnet pack "$project" -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}
          done

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
